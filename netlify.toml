[build]
  publish = "."
  # Endringer bare i innhold (saker, innstillinger, opplastede bilder) bygges ikke:
  # nettsiden henter innholdet rett fra GitHub, så de koster ingen kreditter.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)content/' ':(exclude)images/opplastet/'"

# Innholdsfilene skal alltid hentes ferske
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
